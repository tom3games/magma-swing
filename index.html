#boot{position:fixed;inset:0;z-index:50;overflow:hidden;background:linear-gradient(180deg,#140b09 0%,#2a120a 55%,#5a1a08 78%,#8f2a0a 100%);color:#f7f7f2;font-family:'BIZ UDPGothic','Hiragino Sans','Yu Gothic',sans-serif;transition:opacity .35s ease}

#boot .bub{position:absolute;bottom:calc(24vh - 10px);width:var(--s);height:var(--s);margin-left:calc(var(--s) / -2);border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#ffd27a,#ff7a22 45%,#c2380c 80%);box-shadow:0 0 12px rgba(255,140,40,.7);transform-origin:50% 100%;transform:scale(0);animation:bpop var(--d) ease-in infinite;animation-delay:var(--w)}
#boot .bub::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,190,90,.8);opacity:0;animation:bring var(--d) ease-out infinite;animation-delay:var(--w)}
#boot .card{position:absolute;left:max(18px,8vw);bottom:calc(24vh + 46px);width:min(330px,calc(100% - 36px));display:flex;align-items:flex-end;gap:14px}
#boot .dia{flex:none;width:58px;height:58px}

#boot .rope i{position:absolute;left:0;top:-1px;bottom:-1px;width:0;border-radius:3px;background:#ffb23a;box-shadow:0 0 8px #ff8a2a;transition:width .25s ease-out}
#boot .rope i::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#ffd27a;box-shadow:0 0 10px #ffb23a}

@keyframes bslide{to{transform:translateX(-50%)}}
@keyframes bglow{from{opacity:.65}to{opacity:1}}

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  // 読み込み中の画面。進み具合は本物の読み込み（下の一覧のファイルが届いた量）から出す
  // 一覧はゲームが最初に読む物全部。増やしたら足す（verify.mjs が漏れを見る）。重さは gzip 後の KB
  var lang=null;try{lang=localStorage.getItem('ms.lang')}catch(e){}
  if(!lang)lang=/^ja/.test(navigator.language||'ja')?'ja':'en';
  var TX=lang==='ja'?{msg:'街にフックを掛けています',err:'起動できませんでした',stall:'読み込みが止まっています。電波のいい所で',retry:'もう一度読み込む'}:{msg:'Rigging hooks over the lava',err:'Failed to start',stall:'Loading has stalled. Check your connection',retry:'Reload'};
  document.getElementById('bootMsg').textContent=TX.msg;if(lang!=='ja')document.documentElement.lang='en';
  var FILES={'vendor/three.core.min.js':101,'vendor/three.module.min.js':87,'js/game.js':21,'vendor/jsm/loaders/GLTFLoader.js':25,'vendor/jsm/utils/BufferGeometryUtils.js':9,'shared/sim.js':6,'js/charmodel.js':4,'vendor/jsm/utils/SkeletonUtils.js':3,'js/data.js':3,'sfx.js':3,'support.js':2};
  var GLB={'Ranger.glb':[212,457652],'Rig_Medium_General.glb':[53,139196],'Rig_Medium_MovementBasic.glb':[40,127208]};
  var got={},total=0,k,shown=0,lastMove=Date.now(),done=false,failed=false,errs=[];
  window.__bootFiles=Object.keys(FILES).concat(Object.keys(GLB));
  for(k in FILES)total+=FILES[k];for(k in GLB)total+=GLB[k][0];
  var bar=document.getElementById('bootBar'),pct=document.getElementById('bootPct'),boot=document.getElementById('boot');
  function draw(){
    var sum=0,f;for(f in got)sum+=got[f];
    var v=Math.min(done?100:99,Math.floor(sum/total*100));
    if(v>shown){shown=v;lastMove=Date.now();bar.style.width=v+'%';pct.textContent=v+'%'}
  }
  window.__bootProgress=function(){return shown};
  function seen(name){var path=name.split('?')[0];for(var f in FILES){if(path.slice(-f.length-1)==='/'+f&&!got[f]){got[f]=FILES[f];draw()}}}
  try{
    new PerformanceObserver(function(l){l.getEntries().forEach(function(e){seen(e.name)})}).observe({type:'resource',buffered:true});
  }catch(e){}
  // 人物の 3D（全体の半分）はここで先に取り、届いた量をそのまま進み具合にする。charmodel.js がこれを使う
  window.__bootGlb={};
  Object.keys(GLB).forEach(function(f){
    var w=GLB[f][0],size=GLB[f][1];
    window.__bootGlb[f]=new Promise(function(ok,ng){
      var x=new XMLHttpRequest();x.open('GET','assets/chars/'+f);x.responseType='arraybuffer';
      x.onprogress=function(e){got[f]=w*Math.min(1,e.lengthComputable&&e.total?e.loaded/e.total:e.loaded/size);draw()};
      x.onload=function(){got[f]=w;draw();if(x.status>=200&&x.status<300&&x.response)ok(x.response);else ng(new Error(x.status+' '+f))};
      x.onerror=function(){got[f]=w;draw();ng(new Error('network '+f))};
      x.send();
    });
    window.__bootGlb[f].catch(function(){});
  });
  function fail(title,detail){
    if(done||failed)return;failed=true;
    try{performance.getEntriesByType('resource').forEach(function(e){if(e.responseStatus>=400)detail=(detail?detail+'\n':'')+e.responseStatus+' '+e.name})}catch(e){}
    var d=document.createElement('div');d.id='boot-err';
    var b=document.createElement('b');b.textContent=title;
    var pre=document.createElement('pre');pre.textContent=(detail||'')+'\n'+navigator.userAgent;
    var btn=document.createElement('button');btn.textContent=TX.retry;btn.onclick=function(){location.reload()};
    d.appendChild(b);d.appendChild(pre);d.appendChild(btn);boot.appendChild(d);boot.classList.remove('out');boot.hidden=false;
  }
  window.__bootFail=fail;
  // ファイルが届かない（404 など）・起動中のエラーは、その場で起動失敗の表示を出す
  window.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t!==window&&(t.tagName==='SCRIPT'||(t.tagName==='LINK'&&/stylesheet|modulepreload/.test(t.rel)&&!/fonts\./.test(t.href)))){errs.push('load failed: '+(t.src||t.href));if(!window.__magmaLoaded)fail(TX.err,errs.join('\n'));return}
    errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''));
    if(!window.__magmaLoaded)fail(TX.err,errs.join('\n'));
  },true);
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason));if(!window.__magmaLoaded)fail(TX.err,errs.join('\n'))});
  // 30 秒進まなければ止まっていると知らせる（遅い回線でも進んでいる間は待つ）
  var iv=setInterval(function(){if(done){clearInterval(iv);return}if(Date.now()-lastMove>30000){clearInterval(iv);fail(TX.stall,errs.join('\n'))}},1000);
  // ゲームの準備が全部終わったら（game.js が呼ぶ）、100% を見せてから消す
  window.__bootDone=function(){
    if(done||failed)return;done=true;for(var f in FILES)got[f]=FILES[f];for(f in GLB)got[f]=GLB[f][0];draw();
    setTimeout(function(){boot.classList.add('out');setTimeout(function(){boot.hidden=true},380)},180);
  };
})();
</script>
